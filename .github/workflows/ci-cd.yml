# .github/workflows/ci-cd.yml
#
#   1. test    (CI)  run the Laravel test suite against a real PostgreSQL
#   2. build   (CI)  build the Docker image, push it to GitHub Container Registry
#   3. release (CD)  write the new image tag into k8s/kustomization.yaml
#   4. Argo CD, inside your RKE2 cluster, sees the commit and deploys it:
#        migrate the database (Job)  ->  roll out the new pods (Deployment)

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =============================================================
  # JOB 1 — Run the tests
  # =============================================================
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # A throwaway PostgreSQL that lives only while this job runs.
    # Testing on the same database type as production catches
    # bugs that SQLite would hide.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # These override the SQLite settings in phpunit.xml and .env
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app_test
      DB_USERNAME: app
      DB_PASSWORD: secret

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, mbstring
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  # =============================================================
  # JOB 2 — Build the Docker image and push it to ghcr.io
  # =============================================================
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # Image names must be lowercase; tag = short commit SHA
      - name: Work out image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  # =============================================================
  # JOB 3 — Point the Kubernetes manifests at the new image
  # =============================================================
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Update image tag in manifests
        run: |
          sed -i "s/^\(\s*newTag:\).*/\1 \"${{ needs.build.outputs.tag }}\"/" k8s/kustomization.yaml
          cat k8s/kustomization.yaml

      # Pushes made with GITHUB_TOKEN don't start new workflow runs, so no loop
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: notes-app ${{ needs.build.outputs.tag }}"
          git pull --rebase origin main
          git push origin HEAD:main
